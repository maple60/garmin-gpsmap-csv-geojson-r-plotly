name: Publish tree map

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TREES_CSV_URL: ${{ secrets.TREES_CSV_URL }}
      SPECIES_CSV_URL: ${{ secrets.SPECIES_CSV_URL }}
      CAMPUS_MIN_LAT: ${{ vars.CAMPUS_MIN_LAT }}
      CAMPUS_MAX_LAT: ${{ vars.CAMPUS_MAX_LAT }}
      CAMPUS_MIN_LON: ${{ vars.CAMPUS_MIN_LON }}
      CAMPUS_MAX_LON: ${{ vars.CAMPUS_MAX_LON }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Restore R environment
        uses: r-lib/actions/setup-renv@v2

      - name: Run validation tests
        run: Rscript tests/test-validation.R

      - name: Build public data
        run: Rscript scripts/build_data.R

      - name: Check generated outputs
        run: Rscript scripts/check_generated_outputs.R

      - name: Render site
        run: quarto render

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
